[project]
name = "quantarena"
version = "0.1.0"
description = "Open benchmark comparing AWQ, GPTQ and FP8 quantization on open-weight LLMs"
readme = "README.md"
authors = [
    { name = "Soham", email = "acad.soham@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
quantarena = "quantarena:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
